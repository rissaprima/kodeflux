<style>
:root{
  color-scheme:dark;
  --bg:#0e0c12;--fg:#f4f1ea;--muted:#a29eab;--dim:#6f6b78;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.2);
  --amber:#e7b565;--magenta:#c8578f;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --spine:46px;--gap:16px;
  --hw:56px;--hh:44px;--dh:21px;
  --bh:4.3rem;--bf:.66rem;--av:26px;--btn-w:5.4rem;--btn-h:24px;
}
@media(min-width:701px){:root{
  --spine:150px;--gap:24px;
  --hw:92px;--hh:70px;--dh:28px;
  --bh:5.3rem;--bf:.84rem;--av:52px;--btn-w:7rem;--btn-h:30px;
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html.tr body{background:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:8px}

/* ---------- office: founder in the middle, divisions linked ---------- */
.office{position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--spine) minmax(0,1fr);grid-template-rows:repeat(3,auto);row-gap:var(--gap)}
.net{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.net path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.net .st{stroke:rgba(255,255,255,.13);stroke-width:1.5}
.net .lit{stroke-width:2;stroke-dasharray:1;stroke-dashoffset:0;opacity:.6}
.net .lit.fresh{animation:drawl .8s ease both}
@keyframes drawl{from{stroke-dashoffset:1}}
.fnd{grid-column:2;grid-row:1/4;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;z-index:2}
.fnd::before{content:"";position:absolute;z-index:-1;top:9%;bottom:9%;left:50%;width:2px;margin-left:-1px;border-radius:2px;background:linear-gradient(180deg,transparent,rgba(231,181,101,.6) 15%,rgba(231,181,101,.6) 85%,transparent)}
.av{position:relative;width:var(--av);height:var(--av);border-radius:50%;display:grid;place-items:center;background:#0e0c12;border:1.5px solid var(--amber);box-shadow:0 0 14px -4px rgba(231,181,101,.6)}
.av svg{width:58%;height:58%;fill:none;stroke:var(--amber);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(231,181,101,0)}
.fnd.ask .av::after{animation:ring 1.2s ease-out infinite;border-color:rgba(231,181,101,.8)}
.fnd.got .av::after{animation:ring 1.2s ease-out 2;border-color:rgba(95,191,138,.9)}
.fl{font-family:var(--mono);font-size:.42rem;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:#0e0c12;padding:.1rem .2rem;border-radius:4px}
@media(min-width:701px){.fl{font-size:.64rem;letter-spacing:.1em}}
html.tr .fl{background:transparent}
.badge{position:absolute;right:-7px;top:-7px;min-width:14px;height:14px;border-radius:99px;display:none;place-items:center;font-size:.55rem;font-weight:700;background:var(--amber);color:#1a1306;box-shadow:0 0 0 2px #0e0c12}
.fnd.ask .badge,.fnd.got .badge{display:grid}
.fnd.got .badge{background:#5fbf8a}

.ag{grid-column:var(--gc);grid-row:var(--gr);position:relative;display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));transition:border-color .4s,box-shadow .4s}
.ag::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(70% 60% at 50% 30%,rgba(var(--rgb),.24),transparent 72%);opacity:0;transition:opacity .5s}
.ag::after{content:"";position:absolute;top:50%;height:2px;width:calc(var(--spine) / 2);margin-top:-1px;background:rgba(var(--rgb),.45);transition:background .4s,box-shadow .4s}
.ag.L::after{left:100%}.ag.R::after{right:100%}
.ag.done::after{background:rgba(var(--rgb),.7)}
.ag.on{border-color:rgba(var(--rgb),.7);box-shadow:0 0 0 1px rgba(var(--rgb),.3),0 16px 40px -20px rgba(var(--rgb),.75)}
.ag.on::before{opacity:1}
.ag.on::after{background:rgb(var(--rgb));box-shadow:0 0 10px rgba(var(--rgb),.9)}
.ag.sel{cursor:pointer}
.ag.view{border-color:rgba(var(--rgb),.55)}

.scene{position:relative;height:calc(var(--hh) + var(--dh) - 6px)}

.ag.on .head{opacity:1;animation:work 1.3s ease-in-out infinite}
.desk{position:absolute;left:4%;right:4%;bottom:0;height:var(--dh);display:grid;place-items:center;border-radius:9px 9px 5px 5px;border:1px solid rgba(var(--rgb),.5);background:linear-gradient(180deg,rgba(var(--rgb),.34),rgba(var(--rgb),.12)),#15121c;box-shadow:0 8px 18px -8px rgba(var(--rgb),.7)}
.desk b{position:relative;font-family:var(--mono);font-size:.54rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgb(var(--rgb));filter:brightness(1.25)}
.desk::before{content:"";position:absolute;left:9%;top:calc(var(--dh) * -.42);width:calc(var(--hw) * .36);height:calc(var(--dh) * .45);border-radius:3px 3px 0 0;border:1px solid rgba(var(--rgb),.55);border-bottom:0;background:rgba(var(--rgb),.2);transition:background .4s,box-shadow .4s}
.ag.on .desk::before{background:rgba(var(--rgb),.85);box-shadow:0 0 12px rgba(var(--rgb),.9)}
@media(min-width:701px){.desk b{position:relative;font-size:.68rem}}

.bub{height:var(--bh);display:flex;flex-direction:column;justify-content:center;gap:5px;padding:.3rem .5rem;border-radius:10px;font-size:var(--bf);line-height:1.3;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:left;overflow:hidden;transition:background .4s,border-color .4s,color .4s}
.rw{display:flex;align-items:flex-start;gap:4px}
.t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.ag.on .bub{color:var(--fg);border-color:rgba(var(--rgb),.45);background:rgba(var(--rgb),.1)}
.ag.done:not(.on) .bub{color:#cfc9d8}
.ck{flex:none;width:.95em;color:rgb(var(--rgb));font-style:normal;font-weight:700;visibility:hidden}
.ag.done:not(.on) .ck{visibility:visible}
.ok-btn{align-self:flex-start;width:var(--btn-w);height:var(--btn-h);padding:0;border-radius:8px;border:0;cursor:pointer;font-weight:600;font-size:inherit;color:#1a1306;background:var(--amber);animation:nudge 1.4s ease-in-out infinite}
@media(min-width:701px){.bub{padding:.4rem .7rem}.ag{padding:10px}}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes work{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.45);opacity:0}}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.office.swap .ag{animation:fadein .5s var(--ease) backwards}
@media(prefers-reduced-motion:reduce){.head,.ag.on .head,.office.swap .ag,.ok-btn,.fnd.ask .av::after,.fnd.got .av::after,.net .lit.fresh{animation:none!important}.ag,.ag::before{transition:none}}

/* ---------- desktop: 2 baris x 3 meja, founder di tengah ---------- */
@media(min-width:861px){
  :root{--cgap:28px;--chan:176px}
  .office{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto var(--chan) auto;column-gap:var(--cgap);row-gap:0}
  .fnd{grid-column:1/4;grid-row:2}
  .fnd::before{display:none}
  .ag{grid-column:var(--gch);grid-row:var(--grh)}
  .ag::after{display:none}
}

/* theme: black / grey / purple */
:root{--bg:#0a0a0b;--kline:#242427;--klinehi:#323236;--kteal:#8B5CF6;--ktealb:#A78BFA;--kwhite:#F4F4F5;--kdim:#A1A1AA;--kmute:#6B6B73}
.crew{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;padding:2px 2px 0;min-height:46px}
.cr{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:99px;border:1px solid var(--kline);font-size:10px;font-weight:600;color:var(--kmute);background:rgba(255,255,255,.02);white-space:nowrap;transition:color .3s,border-color .3s,background .3s}
.cr i{width:5px;height:5px;border-radius:50%;background:var(--klinehi);flex:none}
.cr.on{color:var(--kwhite);border-color:rgba(var(--rgb),.75);background:rgba(var(--rgb),.16)}
.cr.on i{background:rgb(var(--rgb));animation:blink 1s infinite}
.cr.done{color:var(--kdim);border-color:rgba(var(--rgb),.35)}
.cr.done i{background:rgb(var(--rgb))}
html.pv .crew{min-height:0;gap:3px}
html.pv .cr{height:15px;padding:0 5px;font-size:8px}
@keyframes blink{50%{opacity:.35}}
@media(max-width:600px){html.pv .crew{display:none}}
.hq{max-width:1100px;margin:0 auto;padding:12px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:0 0 14px}
.chip{flex:1 1 0;min-width:0;text-align:center;min-height:32px;padding:.2rem .1rem;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:#cfc9d8;font-size:.72rem;font-weight:500;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.chip:hover{background:rgba(255,255,255,.09)}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent;background:#8B5CF6}
@media(max-width:700px){.chips{flex-wrap:nowrap;gap:4px}.chip{font-size:.7rem}}
@media(max-width:340px){.chips{flex-wrap:wrap}}

<body>
<div class="hq" id="hq">
  <div class="chips" id="chips" role="group" aria-label="Business type"></div>
  <div class="pvlabel">FluxHQ <span id="pvskin">Agency</span></div>
  <div class="office" id="office"></div>
</div>
<script>
var FxOffice=(function(){
  var NS='http://www.w3.org/2000/svg';
  var REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* index meja: 0 Director, 1 Marketing, 2 Sales, 3 Operation, 4 Production, 5 Finance */
  var DESKS=[
    {n:'Director',  rgb:'231,181,101',hue:140},
    {n:'Marketing', rgb:'200,87,143', hue:100},
    {n:'Sales',     rgb:'154,107,240',hue:20},
    {n:'Operation', rgb:'79,112,222', hue:0},
    {n:'Production',rgb:'63,166,173', hue:300},
    {n:'Finance',   rgb:'95,191,138', hue:275}
  ];
  /* posisi grid [kolom, baris]: kiri Marketing > Sales > Director, kanan Operation > Production > Finance */
  var POS=[[1,3],[1,1],[1,2],[3,3],[3,2],[3,1]];
  /* desktop: baris atas Marketing > Sales > Director, baris bawah Finance > Production > Operation (Operation tepat di bawah Director) */
  var POSH=[[3,1],[1,1],[2,1],[3,3],[2,3],[1,3]];
  var MQ=window.matchMedia?matchMedia('(min-width:861px)'):{matches:false};
  var CHAIN=[[1,2],[2,0],[3,4],[4,5]];

  function make(root,opts){
    opts=opts||{};
    var o={DESKS:DESKS},cards=[],trans=[];
    var fnd=document.createElement('div');
    fnd.className='fnd';fnd.setAttribute('aria-label','Founder');
    fnd.innerHTML='<div class="av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span class="badge">!</span></div><span class="fl">Founder</span>';
    root.appendChild(fnd);
    var av=fnd.querySelector('.av'),badge=fnd.querySelector('.badge');
    var net=document.createElementNS(NS,'svg');
    net.setAttribute('class','net');net.setAttribute('aria-hidden','true');
    root.appendChild(net);

    DESKS.forEach(function(d,i){
      var left=POS[i][0]===1;
      var el=document.createElement('div');
      el.className='ag '+(left?'L':'R');el.id='d'+i;
      el.style.cssText='--rgb:'+d.rgb+';--hue:'+d.hue+'deg;--gc:'+POS[i][0]+';--gr:'+POS[i][1]+';--gch:'+POSH[i][0]+';--grh:'+POSH[i][1];
      el.innerHTML='<div class="scene"><div class="head" role="img" aria-label="Fluxman, meja '+d.n+'"></div><div class="desk"><b>'+d.n+'</b></div></div><div class="bub"><div class="rw"><i class="ck">✓</i><span class="t"></span></div></div>';
      if(opts.onSelect){
        el.classList.add('sel');el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','Buka hasil kerja meja '+d.n);
        el.addEventListener('click',function(){opts.onSelect(i)});
        el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();opts.onSelect(i)}});
      }
      root.appendChild(el);cards.push(el);
    });

    function rel(el){var a=root.getBoundingClientRect(),b=el.getBoundingClientRect();return{l:b.left-a.left,r:b.right-a.left,t:b.top-a.top,b:b.bottom-a.top,cx:(b.left+b.right)/2-a.left,cy:(b.top+b.bottom)/2-a.top}}
    function P(x,y){return x.toFixed(1)+' '+y.toFixed(1)}
    function line(p){return 'M'+p.map(function(q){return P(q[0],q[1])}).join(' L')}
    /* garis siku berujung bulat (rounded elbow) */
    function rounded(p,r){
      var d='M'+P(p[0][0],p[0][1]);
      for(var n=1;n<p.length-1;n++){
        var a=p[n-1],b=p[n],c=p[n+1];
        var l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]);
        if(l1<1||l2<1){d+=' L'+P(b[0],b[1]);continue}
        var rr=Math.min(r,l1/2,l2/2);
        d+=' L'+P(b[0]+(a[0]-b[0])/l1*rr,b[1]+(a[1]-b[1])/l1*rr)+' Q'+P(b[0],b[1])+' '+P(b[0]+(c[0]-b[0])/l2*rr,b[1]+(c[1]-b[1])/l2*rr);
      }
      var z=p[p.length-1];return d+' L'+P(z[0],z[1]);
    }
    /* jalur vertikal tiap pasangan silang, relatif terhadap tengah (dikali setengah lebar celah) */
    var LANE={'1-3':-.6,'1-4':-.36,'2-3':-.12,'2-5':.12,'0-4':.36,'0-5':.6};
    function portY(R,d){return R.t+(R.b-R.t)*(.5+d*.17)}

    /* ---------- desktop (horizontal): jalur lewat koridor di tengah ---------- */
    var HP=null;
    var CROSS=[[1,2],[1,3],[2,3],[2,1],[3,1],[3,2]]; /* urutan jalur dari atas ke bawah: [kolom atas, kolom bawah] */
    function buildH(){
      var R=cards.map(rel),A=rel(av),P={R:R,A:A,port:[{},{},{},{},{},{}]};
      var yT=R[1].b,yB=R[5].t,G=yB-yT;P.yT=yT;P.G=G;
      var col=function(i){return POSH[i][0]},row=function(i){return POSH[i][1]};
      var key=function(a,b){return Math.min(a,b)+'-'+Math.max(a,b)};
      var ent=[[],[],[],[],[],[]];
      for(var a=0;a<6;a++)for(var b=a+1;b<6;b++){
        var dc=Math.abs(col(a)-col(b)),same=row(a)===row(b);
        if(same&&dc===1)continue;          /* tetangga sebaris: garis lurus di celah */
        var k=key(a,b);
        ent[a].push({k:k,tx:R[b].cx});ent[b].push({k:k,tx:R[a].cx});
      }
      for(var i=0;i<6;i++){
        ent[i].push({k:'~F',tx:A.cx});
        ent[i].sort(function(x,y){return Math.abs(x.tx-y.tx)<1?(x.k<y.k?-1:1):x.tx-y.tx});
        var n=ent[i].length;
        ent[i].forEach(function(e,j){P.port[i][e.k==='~F'?'F':e.k]=R[i].l+(R[i].r-R[i].l)*(j+1)/(n+1)});
      }
      /* lane (y) tiap jalur */
      P.lane={};
      var order=[];
      order.push(['skipT',key(1,0)]);
      CROSS.forEach(function(c){
        var t=[1,2,0][c[0]-1],u=[5,4,3][c[1]-1];order.push(['x',key(t,u)]);
      });
      order.push(['skipB',key(5,3)]);
      order.forEach(function(o,idx){P.lane[o[1]]=yT+G*(idx+1)/(order.length+1)});
      HP=P;
    }
    function edgeH(a,b){
      var P=HP,R=P.R,rad=6;
      var col=function(i){return POSH[i][0]},row=function(i){return POSH[i][1]};
      if(a==='F'||b==='F'){
        var di=(a==='F')?b:a,px=P.port[di].F,top=row(di)===1,A=P.A,sx=px<A.cx?A.l:A.r;
        var p=[[px,top?R[di].b:R[di].t],[px,A.cy],[sx,A.cy]];
        if(a==='F')p.reverse();
        return rounded(p,rad);
      }
      var key=Math.min(a,b)+'-'+Math.max(a,b),ra=row(a),rb=row(b),ca=col(a),cb=col(b);
      if(ra===rb){
        if(Math.abs(ca-cb)===1){
          var y=R[a].cy,xa=ca<cb?R[a].r:R[a].l,xb=ca<cb?R[b].l:R[b].r;
          return line([[xa,y],[xb,y]]);
        }
        var ly=P.lane[key],pa=P.port[a][key],pb=P.port[b][key],ea=ra===1?R[a].b:R[a].t,eb=ra===1?R[b].b:R[b].t;
        return rounded([[pa,ea],[pa,ly],[pb,ly],[pb,eb]],rad);
      }
      var xa2=P.port[a][key],xb2=P.port[b][key],ea2=ra===1?R[a].b:R[a].t,eb2=rb===1?R[b].b:R[b].t;
      if(Math.abs(xa2-xb2)<1.5)return line([[xa2,ea2],[xb2,eb2]]);
      var l2=P.lane[key];
      return rounded([[xa2,ea2],[xa2,l2],[xb2,l2],[xb2,eb2]],rad);
    }
    function edge(a,b){
      if(MQ.matches&&HP)return edgeH(a,b);
      var sx=rel(fnd).cx,half=Math.abs(sx-rel(cards[1]).r),rad=Math.max(3,Math.min(10,half*.3));
      if(a==='F'||b==='F'){
        var di=(a==='F')?b:a,R=rel(cards[di]),A=rel(av);
        var side=POS[di][0]===1?R.r:R.l,end=R.cy<A.cy?A.t:A.b;
        var p=[[side,R.cy],[sx,R.cy],[sx,end]];
        if(a==='F')p.reverse();
        return rounded(p,rad);
      }
      var A1=rel(cards[a]),B1=rel(cards[b]),ca=POS[a][0],cb=POS[b][0],ra=POS[a][1],rb=POS[b][1],p;
      if(ca===cb){
        if(Math.abs(ra-rb)===1){
          return line(B1.cy>A1.cy?[[A1.cx,A1.b],[B1.cx,B1.t]]:[[A1.cx,A1.t],[B1.cx,B1.b]]);
        }
        /* satu kolom, loncat satu meja: jalur siku di sisi dalam */
        var up=ra<rb?A1:B1,dn=ra<rb?B1:A1,left=ca===1;
        var inner=left?up.r:up.l,lane=inner+(left?1:-1)*half*.2;
        var y1=up.t+(up.b-up.t)*.3,y2=dn.t+(dn.b-dn.t)*.84;
        p=[[inner,y1],[lane,y1],[lane,y2],[inner,y2]];
        return rounded(ra<rb?p:p.slice().reverse(),rad);
      }
      /* beda kolom: bentuk S, tiap pasangan punya jalur & titik sambung sendiri */
      var xa=ca===1?A1.r:A1.l,xb=cb===1?B1.r:B1.l,ya=portY(A1,rb-ra),yb=portY(B1,ra-rb);
      if(Math.abs(ya-yb)<1)return line([[xa,ya],[xb,yb]]);
      var key=Math.min(a,b)+'-'+Math.max(a,b),lx=sx+(LANE[key]||0)*half;
      return rounded([[xa,ya],[lx,ya],[lx,yb],[xb,yb]],rad);
    }
    function path(cls,d,rgb){
      var e=document.createElementNS(NS,'path');
      e.setAttribute('class',cls);e.setAttribute('d',d);
      if(rgb)e.style.stroke='rgb('+rgb+')';
      net.appendChild(e);return e;
    }
    function draw(){
      var r=root.getBoundingClientRect();
      HP=null;if(MQ.matches)buildH();
      net.setAttribute('viewBox','0 0 '+Math.max(1,r.width)+' '+Math.max(1,r.height));
      net.innerHTML='';
      for(var a=0;a<6;a++)for(var b=a+1;b<6;b++)path('st',edge(a,b));
      trans.forEach(function(t){
        var e=path('lit'+(t.fresh?' fresh':''),edge(t.a,t.b),t.rgb);
        e.setAttribute('pathLength','1');
        t.fresh=false;t.el=e;
      });
    }
    function packet(el,rgb){
      if(REDUCED||!el.getTotalLength)return;
      var len=el.getTotalLength();if(!len)return;
      var c=document.createElementNS(NS,'circle');
      c.setAttribute('r','4.5');c.style.fill='rgb('+rgb+')';c.style.filter='drop-shadow(0 0 6px rgb('+rgb+'))';
      net.appendChild(c);
      var t0=performance.now(),dur=Math.min(900,350+len*1.4);
      (function f(t){
        var k=Math.min(1,(t-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,pt=el.getPointAtLength(len*e);
        c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);
        if(k<1)requestAnimationFrame(f);else c.remove();
      })(t0);
    }
    /* kirim "paket kerja" dari meja a ke meja b (atau 'F' = founder) */
    o.transit=function(a,b){
      var dest=(b==='F')?a:b,rgb=DESKS[dest==='F'?0:dest].rgb;
      var t={a:a,b:b,rgb:rgb,fresh:true};
      trans.push(t);draw();
      if(t.el)packet(t.el,rgb);
    };
    o.redraw=draw;
    o.reset=function(){trans=[];draw()};
    o.el=function(i){return cards[i]};
    o.box=function(i){return cards[i].querySelector('.bub')};
    o.txt=function(i){return cards[i].querySelector('.t')};
    o.fnd=fnd;o.badge=badge;
    o.setIdle=function(texts){
      DESKS.forEach(function(d,i){
        cards[i].classList.remove('on','done');
        [].slice.call(o.box(i).querySelectorAll('.ok-btn')).forEach(function(x){x.remove()});
        if(texts)o.txt(i).textContent=texts[i];
      });
      fnd.classList.remove('ask','got');badge.textContent='!';
    };
    o.activate=function(i,text){
      cards.forEach(function(c){c.classList.remove('on')});
      cards[i].classList.add('on');cards[i].classList.remove('done');
      if(text!=null)o.txt(i).textContent=text;
    };
    o.complete=function(i,text){
      cards[i].classList.remove('on');cards[i].classList.add('done');
      o.txt(i).textContent=text||'';
    };
    o.view=function(i){cards.forEach(function(c,j){c.classList.toggle('view',j===i)})};
    if('ResizeObserver' in window)new ResizeObserver(draw).observe(root);
    window.addEventListener('resize',draw);
    window.addEventListener('load',draw);
    draw();
    return o;
  }
  return {make:make,DESKS:DESKS};
})();

(function(){
  var Q=new URLSearchParams(location.search);
  var PREVIEW=Q.get('mode')==='preview';
  var root=document.documentElement;
  if(PREVIEW)root.classList.add('pv');
  if(Q.get('bg')==='transparent')root.classList.add('tr');
  var AUTOPLAY=Q.get('autoplay')!=='0';

  /* alur: [meja, perlu persetujuan] */
  var STEPS=[[1],[2],[0,1],[3],[4],[5],[0]];
  var MAXC=34;

  var SKINS={
    agency:{chip:'Agency',name:'Creative Agency',
      idle:['Watch margins & client priorities','Portfolio content & case studies','Qualify budgets & draft proposals','Plan schedules, revisions & deadlines','Copy, moodboards & QC','Collect DP & final payments'],
      flow:['New inquiry: cafe rebrand','Proposal draft is ready','Approve the Rp 45M proposal now?','4-week schedule is set','Brief & moodboard ready','50% DP invoice sent','Summary sent to the owner'],
      ok:'Approved: Rp 45M proposal'},
    rental:{chip:'Rental',name:'Rental I/O',
      idle:['Track utilization & unit servicing','Promote idle units in the catalog','Check the calendar & lock bookings','Plan delivery & return times','Clean, test & photograph units','Collect rent, deposits & refunds'],
      flow:['New inquiry: 3-day rental','Calendar checked, booking sent','Approve this 10% rental discount?','Delivery & pickup scheduled','Unit cleaned & photographed','Rental & deposit invoice sent','Summary sent to the owner'],
      ok:'Approved: 10% rental discount'},
    travel:{chip:'Travel',name:'Travel I/O',
      idle:['Track trip occupancy & margin','Promote open trips & destinations','Qualify leads & send itineraries','Arrange pickups, tickets & vendors','Build itineraries & vouchers','Collect DP, balances & refunds'],
      flow:['New inquiry: trip for 4','Itinerary & price sent','Approve a special group price?','Pickup & vendors scheduled','Vouchers & briefing prepared','Trip DP invoice sent','Summary sent to the owner'],
      ok:'Approved: special group price'},
    party:{chip:'Party',name:'Party I/O',
      idle:['Track events & project margins','Portfolio content & package promos','Qualify leads & send proposals','Plan rundowns, vendors & crew','Prepare decor & venue checklists','Collect event DP & balances'],
      flow:['New inquiry: birthday, 50 guests','Proposal & estimate sent','Approve extra stage decor?','Rundown & vendors scheduled','Moodboard & checklist ready','Event DP invoice sent','Summary sent to the owner'],
      ok:'Approved: extra decor'},
    mentor:{chip:'Mentor',name:'Mentor I/O',
      idle:['Review curriculum & new batches','Tips content & alumni stories','Qualify & close students','Send Zoom, recordings, attendance','Make worksheets & session recaps','Bill classes & remind installments'],
      flow:['New signup: November batch','Prospect qualified','Approve a 1-seat scholarship?','Zoom link & schedule sent','Session 1 worksheet prepared','Billing & installments scheduled','Summary sent to the owner'],
      ok:'Approved: 1-seat scholarship'},
    retail:{chip:'Retail',name:'Retail',
      idle:['Track sales & low stock','Product promos & catalog content','Reply to chats & process orders','Handle shipping, tracking & returns','Update listings, photos & stock','Reconcile payments, fees & refunds'],
      flow:['New chat: stock & shipping','Order processed, pay link ready','Approve a refund for a damaged order?','Tracking sent to the customer','Listing & stock updated','Payment has been matched','Summary sent to the owner'],
      ok:'Approved: order refund'}
  };
  var ORDER=['agency','rental','travel','party','mentor','retail'];
  ORDER.forEach(function(k){var S=SKINS[k];S.idle.concat(S.flow,[S.ok]).forEach(function(x){if(x.length>MAXC&&window.console)console.warn('FluxHQ: text > '+MAXC+' chars',k,x)})});

  var $=function(id){return document.getElementById(id)};
  var chips=$('chips'),skin=Q.get('skin');
  if(!SKINS[skin])skin='agency';
  var O=FxOffice.make($('office'));
  var ROSTER=[['Briefing','Approvals','Reports'],['Lead Intake','Content','Social'],['Qualifier','Proposal','Follow-up'],['Scheduler','Project Mgr','Client Comms'],['Copywriter','Design Brief','QC Review'],['Invoicing','Collections','Bookkeeping']];
  var STEPAG=[0,1,1,0,1,0,2];
  O.DESKS.forEach(function(D,i){var c=document.createElement('div');c.className='crew';c.innerHTML=ROSTER[i].map(function(n,k){return '<span class="cr" data-a="'+k+'"><i></i>'+n+'</span>'}).join('');O.el(i).appendChild(c)});
  function crew(d,a){return O.el(d).querySelector('.cr[data-a="'+a+'"]')}
  function crewReset(){[].forEach.call(document.querySelectorAll('.cr'),function(c){c.classList.remove('on','done')})}

  ORDER.forEach(function(k){
    var b=document.createElement('button');b.type='button';b.className='chip';b.dataset.k=k;b.textContent=SKINS[k].chip;
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){setSkin(k,true)});
    chips.appendChild(b);
  });

  var token=0,hidden=false,approveResolve=null;
  function wait(t,ms){
    return new Promise(function(res,rej){
      var left=ms;
      (function step(){
        if(t!==token)return rej(new Error('x'));
        if(hidden)return setTimeout(step,150);
        if(left<=0)return res();
        left-=100;setTimeout(step,100);
      })();
    });
  }
  function setSkin(k,restart){
    skin=k;
    [].forEach.call(chips.querySelectorAll('.chip'),function(c){c.setAttribute('aria-pressed',String(c.dataset.k===k))});
    $('pvskin').textContent=SKINS[k].chip;
    var off=$('office');off.classList.remove('swap');void off.offsetWidth;off.classList.add('swap');
    O.reset();crewReset();O.setIdle(SKINS[k].idle);sendHeight();
    if(restart)start();
  }
  function approval(t){
    var fnd=O.fnd;
    fnd.classList.add('ask');O.badge.textContent='!';
    O.transit(0,'F');
    if(PREVIEW)return wait(t,1700).then(function(){fnd.classList.remove('ask');O.transit('F',0)});
    var btn=document.createElement('button');btn.type='button';btn.className='ok-btn';btn.textContent='Approve';
    O.box(0).appendChild(btn);
    return new Promise(function(res,rej){
      var done=false;
      function fin(){if(done)return;done=true;approveResolve=null;btn.remove();fnd.classList.remove('ask');O.transit('F',0);res()}
      approveResolve=fin;
      btn.addEventListener('click',fin);
      wait(t,6000).then(fin,function(e){if(!done){done=true;approveResolve=null;btn.remove();fnd.classList.remove('ask');rej(e)}});
    });
  }
  async function play(t){
    var S=SKINS[skin];
    O.reset();crewReset();O.setIdle(S.idle);
    await wait(t,PREVIEW?900:1100);
    var prev=null;
    for(var i=0;i<STEPS.length;i++){
      var d=STEPS[i][0];
      if(prev!==null&&prev!==d)O.transit(prev,d);
      O.activate(d,S.flow[i]);var ce=crew(d,STEPAG[i]);ce.classList.remove('done');ce.classList.add('on');
      if(i===1){O.transit(2,3);O.transit(2,5)}
      if(i===4){O.transit(4,1);O.transit(4,0)}
      if(STEPS[i][1])await approval(t);else await wait(t,PREVIEW?1900:2300);
      O.complete(d,i===2?S.ok:S.flow[i]);ce.classList.remove('on');ce.classList.add('done');
      prev=d;
    }
    O.transit(0,'F');
    O.badge.textContent='✓';O.fnd.classList.add('got');
    await wait(t,PREVIEW?2600:3200);
  }
  async function start(){
    var t=++token;
    if(approveResolve){try{approveResolve()}catch(e){}}
    try{
      while(t===token){
        await play(t);
        if(PREVIEW){var n=ORDER[(ORDER.indexOf(skin)+1)%ORDER.length];setSkin(n,false)}
      }
    }catch(e){}
  }
  document.addEventListener('visibilitychange',function(){hidden=document.hidden});
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(en){hidden=document.hidden||!en[0].isIntersecting},{threshold:.05}).observe($('hq'));
  }
  var lastH=0;
  function sendHeight(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h&&h!==lastH&&window.parent!==window){lastH=h;window.parent.postMessage({type:'fluxhq:height',height:h},'*')}
  }
  window.addEventListener('resize',sendHeight);
  if('ResizeObserver' in window)new ResizeObserver(sendHeight).observe($('hq'));
  window.addEventListener('load',sendHeight);
  setSkin(skin,false);
  if(AUTOPLAY)start();
})();
