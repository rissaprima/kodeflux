<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FluxHQ — Virtual office embed | Kodeflux</title>
<meta name="description" content="FluxHQ embed: six AI divisions and a founder connected. Watch a request flow from desk to desk.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://kodeflux.web.id/corp">
<meta name="theme-color" content="#0e0c12">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0e0c12;--fg:#f4f1ea;--muted:#a29eab;--dim:#6f6b78;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.2);
  --amber:#e7b565;--magenta:#c8578f;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --hw:56px;--hh:44px;--bf:.66rem;--av:28px;--btn-w:5.4rem;--btn-h:24px;--agw:150px;
}
@media(min-width:701px){:root{--hw:92px;--hh:70px;--bf:.8rem;--av:52px;--btn-w:7rem;--btn-h:30px;--agw:190px}}
:root{--iw:170px;--pw:calc(var(--iw)*.8);--bh:88px}
.narrow{--bh:76px}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html.tr body{background:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:8px}
.hq{position:relative;isolation:isolate}
#bgfx{position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);z-index:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent),linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent),linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-composite:intersect}

/* ---------- circular office: founder in the middle, 6 divisions, 18 agents ---------- */
.office{position:relative;z-index:1;width:100%;min-height:340px}
.net,.sweep{position:absolute;pointer-events:none}
.net{left:0;top:0;width:100%;height:100%;overflow:visible;z-index:1}
.sweep{z-index:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(139,92,246,0) 0deg,rgba(139,92,246,.2) 38deg,rgba(139,92,246,0) 80deg);
  -webkit-mask-image:radial-gradient(circle,transparent 18%,#000 19%,#000 100%);mask-image:radial-gradient(circle,transparent 18%,#000 19%,#000 100%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.net path,.net circle.ring{fill:none;stroke-linecap:round;stroke-linejoin:round}
.net .st{stroke:rgba(196,181,253,.3);stroke-width:1.6;stroke-dasharray:2 9;animation:flow 2.4s linear infinite}
.net .ring{stroke:rgba(196,181,253,.22);stroke-width:1.4;stroke-dasharray:1 7;animation:flow 3.2s linear infinite}
.net .lit{stroke-width:2.6;stroke-dasharray:1;stroke-dashoffset:0;opacity:.9;filter:drop-shadow(0 0 5px rgba(167,139,250,.8))}
.net .lit.fresh{animation:drawl .8s ease both}
.net .orb{fill:rgba(196,181,253,.9)}
.net .pulse{fill:none;stroke:rgba(167,139,250,.55);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-out infinite;opacity:0}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes drawl{from{stroke-dashoffset:1}}
@keyframes pulse{0%{transform:scale(.1);opacity:.7}100%{transform:scale(1);opacity:0}}

.fnd{position:absolute;z-index:60;transform:translate(-50%,-50%);display:grid;place-items:center}
.av{position:relative;width:var(--av);height:var(--av);border-radius:50%;display:grid;place-items:center;background:#0e0c12;border:1.5px solid var(--amber);box-shadow:0 0 18px -2px rgba(231,181,101,.7)}
.av svg{width:58%;height:58%;fill:none;stroke:var(--amber);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(231,181,101,0)}
.aura{position:absolute;inset:-20px;border-radius:50%;z-index:-1;pointer-events:none;background:radial-gradient(circle,rgba(231,181,101,.42),rgba(231,181,101,0) 68%);animation:auraP 3.2s ease-in-out infinite}
@keyframes auraP{50%{transform:scale(1.25);opacity:.6}}
.fnd.ask .av::after{animation:ring 1.2s ease-out infinite;border-color:rgba(231,181,101,.8)}
.fnd.got .av::after{animation:ring 1.2s ease-out 2;border-color:rgba(95,191,138,.9)}
.av{width:var(--evw);height:var(--evw);border-radius:50%;background:none!important;border:0!important;box-shadow:none!important}
.av::after{display:none}
.av canvas.eq{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.av .aura{inset:12%!important;background:radial-gradient(circle,rgba(124,79,216,.32),rgba(124,79,216,0) 70%)!important}
.av .badge{right:auto;top:auto;left:calc(50% + var(--evw)*.17);top:calc(50% - var(--evw)*.27)}
.fnd .fl{top:calc(50% + var(--evw)*.5)}
:root{--evw:84px}
@media(min-width:701px){:root{--evw:132px}}
.fl{position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
@media(min-width:701px){.fl{font-size:.64rem}}
.narrow .fl{display:none}
.badge{position:absolute;right:-7px;top:-7px;min-width:14px;height:14px;border-radius:99px;display:none;place-items:center;font-size:.55rem;font-weight:700;background:var(--amber);color:#1a1306;box-shadow:0 0 0 2px #0e0c12}
.fnd.ask .badge,.fnd.got .badge{display:grid}
.fnd.got .badge{background:#5fbf8a}

/* division = zero-size anchor at the node's center */
.ag{position:absolute;width:0;height:0;z-index:10}
.ag.on{z-index:900}
.ag.sel{cursor:pointer}
.scene{position:absolute;left:0;top:0;width:0;height:0;animation:flt 6.5s ease-in-out infinite;animation-delay:calc(var(--fi,0)*-1.15s)}
@keyframes flt{50%{transform:translateY(-5px)}}
.plate{position:absolute;left:calc(var(--pw)/-2);top:calc(var(--pw)*.08);width:var(--pw);height:calc(var(--pw)*.5);border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(var(--rgb),.22),rgba(var(--rgb),0) 70%);transition:opacity .4s;opacity:.7}
  background:radial-gradient(circle at 50% 40%,rgba(var(--rgb),.3),rgba(var(--rgb),.07) 68%,rgba(var(--rgb),0));
  border:1px solid rgba(var(--rgb),.45);box-shadow:0 12px 30px -14px rgba(var(--rgb),.8),inset 0 0 18px rgba(var(--rgb),.14);transition:border-color .4s,box-shadow .4s}
.ag.on .plate{opacity:1}
.isl{position:absolute;left:calc(var(--iw)/-2);top:calc(var(--iw)*-.5);width:var(--iw);height:var(--iw);background:center/contain no-repeat;opacity:.62;filter:hue-rotate(var(--hr,0deg)) saturate(.85) brightness(.85) drop-shadow(0 0 8px rgba(var(--rgb),.18));transition:filter .4s,opacity .4s}

.ag.on .isl{opacity:.85;filter:hue-rotate(var(--hr,0deg)) brightness(1) saturate(1) drop-shadow(0 0 14px rgba(var(--rgb),.5));animation:work 1.3s ease-in-out infinite}
.ag.done:not(.on) .isl{opacity:.72;filter:hue-rotate(var(--hr,0deg)) saturate(.9) brightness(.9) drop-shadow(0 0 10px rgba(var(--rgb),.35))}
.desk{position:absolute;left:-70px;width:140px;text-align:center;top:calc(var(--iw)*.4)}
.desk b{display:inline-block;padding:.12rem .55rem;border-radius:99px;background:rgba(var(--rgb),.14);border:1px solid rgba(var(--rgb),.4);font-family:var(--mono);font-size:.54rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;line-height:1.2;color:rgb(var(--rgb));filter:brightness(1.25)}
@media(min-width:701px){.desk b{font-size:.64rem}}
.ag.done .desk b::after{content:" \2713"}
.narrow .desk{top:calc(var(--iw)*.36)}
.narrow .desk b{font-size:6.5px;padding:.08rem .35rem;letter-spacing:.06em}
.narrow .bub{padding:.3rem .45rem;font-size:.58rem;gap:3px}
.narrow .bub::before{font-size:.5rem}
.narrow .rw{gap:3px}
.ag.view .desk b{background:rgba(var(--rgb),.3)}
.bub::before{display:none;content:attr(data-n);font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:rgb(var(--rgb));filter:brightness(1.25)}
.narrow .bub::before{display:block}
.bub{position:absolute;width:var(--capw);height:var(--bh);justify-content:center;overflow:hidden;display:flex;flex-direction:column;gap:5px;padding:.4rem .6rem;border-radius:12px;font-size:var(--bf);line-height:1.3;color:var(--muted);background:rgba(14,12,18,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);text-align:left;transition:background .4s,border-color .4s,color .4s}
.ag.on .bub{color:var(--fg);border-color:rgba(var(--rgb),.5);background:rgba(var(--rgb),.14)}
.ag.done:not(.on) .bub{color:#cfc9d8}
.ag.done:not(.on) .ck{visibility:visible}
.rw{display:flex;align-items:flex-start;gap:4px}
.t{flex:0 1 auto;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.ck{flex:none;width:.95em;color:rgb(var(--rgb));font-style:normal;font-weight:700;visibility:hidden}
.ok-btn{align-self:flex-start;width:var(--btn-w);height:var(--btn-h);padding:0;border-radius:8px;border:0;cursor:pointer;font-weight:600;font-size:inherit;color:#1a1306;background:var(--amber);animation:nudge 1.4s ease-in-out infinite}

/* agents: glowing nodes on the outer ring, names run outward along the radius */
.cr{position:absolute;left:0;top:0;width:0;height:0}
.cr .ln{position:absolute;left:0;top:0;height:1px;margin-top:-.5px;transform-origin:0 50%;background:rgba(var(--rgb),.22);z-index:-1;transition:background .3s,box-shadow .3s}
.cr .pk{position:absolute;top:50%;left:0;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:rgb(var(--rgb));box-shadow:0 0 8px rgb(var(--rgb));opacity:0;animation:pk 3.4s linear infinite;animation-delay:var(--pd,0s)}
.cr.on .pk{width:7px;height:7px;margin:-3.5px 0 0 -3.5px;animation-duration:.9s;animation-delay:0s}
@keyframes pk{0%{left:0;opacity:0}12%{opacity:.85}88%{opacity:.85}100%{left:100%;opacity:0}}
.cr .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#1b1a20;border:1.5px solid rgba(var(--rgb),.55);transition:background .3s,box-shadow .3s}
.cr .nm{position:absolute;left:-44px;top:10px;width:88px;text-align:center;line-height:12px;font-size:10px;font-weight:600;color:var(--kmute,#6B6B73);transition:color .3s}
.narrow .nm{left:-28px;width:56px;top:8px;font-size:7.5px;line-height:9px}
.cr.on .ln{background:rgb(var(--rgb));box-shadow:0 0 8px rgb(var(--rgb))}
.cr.on .dot{background:rgb(var(--rgb));box-shadow:0 0 14px rgb(var(--rgb));animation:blink 1s infinite}
.cr.on .nm{color:#fff}
.cr.done .dot{background:rgba(var(--rgb),.85)}
.cr.done .ln{background:rgba(var(--rgb),.5)}
.cr.done .nm{color:#c9c4d3}

@keyframes work{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.45);opacity:0}}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes blink{50%{opacity:.45}}
@keyframes fadein{from{opacity:0}}
.office.swap .ag{animation:fadein .5s var(--ease) backwards}
@media(prefers-reduced-motion:reduce){.isl,.ag.on .isl,.cr .pk, .scene,.aura,.sweep,.office.swap .ag,.ok-btn,.fnd.ask .av::after,.fnd.got .av::after,.ag.on .plate::after,.cr.on .dot,.net .lit.fresh,.net .st,.net .ring,.net .pulse{animation:none!important}}

:root{--bg:#0a0a0b;--kline:#242427;--klinehi:#323236;--kmute:#6B6B73;--kdim:#A1A1AA}
.hq{max-width:1100px;margin:0 auto;padding:12px}
.chips{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:0 0 6px}
.chip{flex:1 1 0;min-width:0;text-align:center;min-height:32px;padding:.2rem .1rem;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:#cfc9d8;font-size:.72rem;font-weight:500;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.chip:hover{background:rgba(255,255,255,.09)}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent;background:#8B5CF6}

<script>
var FxOffice=(function(){
  var NS='http://www.w3.org/2000/svg';
  var REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* index meja: 0 Director, 1 Marketing, 2 Sales, 3 Operation, 4 Production, 5 Finance */
  var DESKS=[
    {n:'Director',  rgb:'231,181,101',hue:140,hr:140},
    {n:'Marketing', rgb:'200,87,143', hue:100,hr:55},
    {n:'Sales',     rgb:'154,107,240',hue:20,hr:0},
    {n:'Operation', rgb:'79,112,222', hue:0,hr:-15},
    {n:'Production',rgb:'63,166,173', hue:300,hr:-50},
    {n:'Finance',   rgb:'95,191,138', hue:275,hr:-95}
  ];
  /* posisi grid [kolom, baris]: kiri Marketing > Sales > Director, kanan Operation > Production > Finance */
  var POS=[[1,3],[1,1],[1,2],[3,3],[3,2],[3,1]];
  /* desktop: baris atas Marketing > Sales > Director, baris bawah Finance > Production > Operation (Operation tepat di bawah Director) */
  var POSH=[[3,1],[1,1],[2,1],[3,3],[2,3],[1,3]];
  var MQ=window.matchMedia?matchMedia('(min-width:861px)'):{matches:false};
  var CHAIN=[[1,2],[2,0],[3,4],[4,5]];

  function make(root,opts){
    opts=opts||{};
    var o={DESKS:DESKS},cards=[],trans=[],orb=[],L={W:0},lastW=0;
    /* sudut layar (derajat, 0 = kanan, searah jarum jam): Director di atas, lalu Operation, Production, Finance, Marketing, Sales */
    var DANG=[-90,150,210,-30,30,90],RINGO=[0,3,4,5,1,2];
    var sweep=document.createElement('div');sweep.className='sweep';sweep.setAttribute('aria-hidden','true');
    var net=document.createElementNS(NS,'svg');net.setAttribute('class','net');net.setAttribute('aria-hidden','true');
    root.appendChild(sweep);root.appendChild(net);
    var fnd=document.createElement('div');
    fnd.className='fnd';fnd.setAttribute('aria-label','Founder');
    fnd.innerHTML='<div class="av"><i class="aura"></i><canvas class="eq" aria-hidden="true"></canvas><span class="badge">!</span></div><span class="fl">Founder</span>';
    (function(){var cv=fnd.querySelector('canvas.eq'),g=cv.getContext('2d'),W=0,t=0,e=.3,D=1,RED=REDUCED;
      function fit(){D=Math.min(devicePixelRatio||1,2);var r=cv.getBoundingClientRect();W=r.width;cv.width=W*D;cv.height=W*D;g.setTransform(D,0,0,D,0,0)}
      if('ResizeObserver' in window)new ResizeObserver(fit).observe(cv);fit();
      function eq(n,r0,base,amp,a0,a1,ph,lw,ev,rgb){for(var i=0;i<n;i++){var a=i/n*6.283,w=Math.sin(a*5+t*(2+ev*8)+ph)+Math.sin(a*3-t*3.1+ph),len=56*(base+.02*w+ev*(amp+amp*.7*w));
        g.strokeStyle='rgba('+rgb+','+(a0+a1*ev).toFixed(2)+')';g.lineWidth=lw;g.beginPath();g.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);g.lineTo(Math.cos(a)*(r0+len),Math.sin(a)*(r0+len));g.stroke()}}
      (function frame(){requestAnimationFrame(frame);
        if(o.paused||document.hidden||!W)return;
        if(!RED)t+=.016;
        var tg=fnd.classList.contains('ask')?.6:fnd.classList.contains('got')?.45:.3;e+=(tg-e)*.06;
        var rgb=fnd.classList.contains('ask')?'246,213,143':fnd.classList.contains('got')?'166,239,198':'244,239,255';
        g.clearRect(0,0,W,W);g.save();g.translate(W/2,W/2);var k=W/112;g.scale(k,k);g.lineCap='round';
        g.shadowColor='rgba(167,139,250,.85)';g.shadowBlur=6;
        eq(56,22,.11,.17,.78,.22,0,2.3,e,rgb);
        g.shadowBlur=0;
        eq(88,46,.015,.05,.12,.2,1.7,1.2,e,rgb);
        g.restore()})()})();
    root.appendChild(fnd);
    var av=fnd.querySelector('.av'),badge=fnd.querySelector('.badge');

    DESKS.forEach(function(d,i){
      var el=document.createElement('div');
      el.className='ag';el.id='d'+i;
      el.style.cssText='--rgb:'+d.rgb+';--hue:'+d.hue+'deg;--hr:'+d.hr+'deg;--fi:'+i;
      el.innerHTML='<div class="scene"><div class="plate"></div><div class="isl '+(i<3?'a':'b')+'" role="img" aria-label="Meja '+d.n+'"></div></div><div class="desk"><b>'+d.n+'</b></div><div class="bub" data-n="'+d.n+'"><div class="rw"><i class="ck">✓</i><span class="t"></span></div></div>';
      if(opts.onSelect){
        el.classList.add('sel');el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','Buka hasil kerja meja '+d.n);
        el.addEventListener('click',function(){opts.onSelect(i)});
        el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();opts.onSelect(i)}});
      }
      root.appendChild(el);cards.push(el);
    });

    function rad(d){return d*Math.PI/180}
    function dpos(i){var a=rad(DANG[i]);return{x:L.cx+Math.cos(a)*L.r1,y:L.cy+Math.sin(a)*L.r1}}
    function poly(p){return p.map(function(q,n){return(n?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1)}).join(' ')}
    function rp(i){return RINGO.indexOf(i)}
    function adj(a,b){var d=Math.abs(rp(a)-rp(b));return d===1||d===5}
    function edgePts(a,b){
      var p=[],k,t,m;
      if(a==='F'||b==='F'){
        var di=a==='F'?b:a,q=dpos(di);
        for(k=0;k<=12;k++){t=k/12;p.push({x:q.x+(L.cx-q.x)*t*.7,y:q.y+(L.cy-q.y)*t*.7})}
        return a==='F'?p.reverse():p;
      }
      if(adj(a,b)){
        var A=DANG[a],dd=((DANG[b]-A+540)%360)-180;
        for(k=0;k<=24;k++){t=rad(A+dd*k/24);p.push({x:L.cx+Math.cos(t)*L.r1,y:L.cy+Math.sin(t)*L.r1})}
        return p;
      }
      var P0=dpos(a),P2=dpos(b),C={x:L.cx+((P0.x+P2.x)/2-L.cx)*.3,y:L.cy+((P0.y+P2.y)/2-L.cy)*.3};
      for(k=0;k<=24;k++){t=k/24;m=1-t;p.push({x:m*m*P0.x+2*m*t*C.x+t*t*P2.x,y:m*m*P0.y+2*m*t*C.y+t*t*P2.y})}
      return p;
    }
    function place(i){
      var el=cards[i],ags=el._ag;if(!ags||!L.W)return;
      var dp=dpos(i),n=ags.length;
      ags.forEach(function(a,k){
        var phi=rad(DANG[i]+(k-(n-1)/2)*L.spread),ax=L.cx+Math.cos(phi)*L.r2,ay=L.cy+Math.sin(phi)*L.r2,dx=ax-dp.x,dy=ay-dp.y;
        a.style.left=dx.toFixed(1)+'px';a.style.top=dy.toFixed(1)+'px';
        var ln=a.firstChild,len=Math.max(0,Math.hypot(dx,dy)-L.pw*.5);
        ln.style.width=len.toFixed(1)+'px';ln.style.transform='rotate('+(Math.atan2(-dy,-dx)*180/Math.PI).toFixed(1)+'deg)';
      });
    }
    o.agents=function(i,names){
      var el=cards[i];(el._ag||[]).forEach(function(a){a.remove()});
      el._ag=names.map(function(n,k){
        var a=document.createElement('span');a.className='cr';a.setAttribute('data-a',k);
        a.innerHTML='<i class="ln"><b class="pk"></b></i><i class="dot"></i><span class="nm"></span>';a.lastChild.textContent=n;a.style.setProperty('--pd',(-Math.random()*3.4).toFixed(2)+'s');
        el.appendChild(a);return a;
      });
      place(i);
    };
    function layout(){
      var W=root.clientWidth;if(!W)return false;
      var narrow=W<(opts.wideMin||1000);
      root.classList.toggle('narrow',narrow);
      var bh=parseFloat(getComputedStyle(cards[0].querySelector('.bub')).height)||80;
      var bw,r2,r1,R,cx=W/2,cy,H,G=14,yTop=4,yBot=0,x0=12;
      if(narrow){
        var size=Math.min(W,opts.maxSize||820);R=size/2;r2=R-24;r1=r2*.56;bw=Math.min(200,(W-32)/3);x0=Math.max(12,(W-(3*bw+8))/2);
        cy=yTop+bh+G+5+r2;yBot=cy+r2+24+G;H=Math.ceil(yBot+bh+4);
      }else{
        bw=Math.max(150,Math.min(200,W*.17));r2=Math.min(330,W/2-bw-62);r1=r2*.6;R=r2+44;cy=R+10;H=Math.ceil(2*R+24);
      }
      root.style.setProperty('--capw',Math.round(bw)+'px');var iw=Math.max(70,Math.min(200,r1*(narrow?.86:.9)));root.style.setProperty('--iw',iw.toFixed(0)+'px');var pw=parseFloat(getComputedStyle(cards[0].querySelector('.plate')).width)||80;
      L={W:W,H:H,cx:cx,cy:cy,r1:r1,r2:r2,pw:pw,spread:narrow?11:14,narrow:narrow};
      root.style.height=H+'px';
      sweep.style.cssText='left:'+(cx-r2).toFixed(1)+'px;top:'+(cy-r2).toFixed(1)+'px;width:'+(2*r2).toFixed(1)+'px;height:'+(2*r2).toFixed(1)+'px';
      /* kartu task berukuran sama: mobile = baris atas/bawah (margin atas = margin bawah), desktop = kolom kiri/kanan (margin kiri = margin kanan) */
      var NCOL=[1,0,0,2,2,1],NTOP=[1,0,1,1,0,0],WROW=[0,2,1,0,1,2],M=6;
      cards.forEach(function(el,i){
        var p=dpos(i),b=el.querySelector('.bub'),bl,bt;
        el.style.left=p.x.toFixed(1)+'px';el.style.top=p.y.toFixed(1)+'px';el.style.zIndex=String(10+Math.round(p.y/8));
        if(narrow){bl=x0+NCOL[i]*(bw+4)-p.x;bt=(NTOP[i]?yTop:yBot)-p.y}
        else{
          bl=(i<=2?M:W-M-bw)-p.x;
          bt=cy+(WROW[i]-1)*.78*r2-bh/2-p.y;
        }
        b.style.left=bl.toFixed(1)+'px';b.style.top=bt.toFixed(1)+'px';b.style.transform='none';
        place(i);
      });
      fnd.style.left=cx.toFixed(1)+'px';fnd.style.top=cy.toFixed(1)+'px';
      return true;
    }
    function path(cls,d,rgb){
      var e=document.createElementNS(NS,'path');
      e.setAttribute('class',cls);e.setAttribute('d',d);
      if(rgb)e.style.stroke='rgb('+rgb+')';
      net.appendChild(e);return e;
    }
    function circ(cls,r){
      var e=document.createElementNS(NS,'circle');
      e.setAttribute('class',cls);e.setAttribute('cx',L.cx);e.setAttribute('cy',L.cy);e.setAttribute('r',r);
      net.appendChild(e);return e;
    }
    function drawNet(){
      if(!L.W)return;
      net.setAttribute('viewBox','0 0 '+L.W+' '+L.H);
      net.innerHTML='<defs><radialGradient id="rg"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".26"/><stop offset=".55" stop-color="#6d49c9" stop-opacity=".08"/><stop offset="1" stop-color="#6d49c9" stop-opacity="0"/></radialGradient></defs>';
      var bgc=circ('',L.r2+14);bgc.setAttribute('fill','url(#rg)');
      var k;
      for(k=0;k<3;k++){var pu=circ('pulse',L.r1*.95);pu.style.animationDelay=(k*2)+'s'}
      circ('ring',L.r1);circ('ring',L.r2);
      for(k=0;k<6;k++)path('st',poly(edgePts('F',k)));
      trans.forEach(function(t){
        var e=path('lit'+(t.fresh?' fresh':''),poly(edgePts(t.a,t.b)),t.rgb);
        e.setAttribute('pathLength','1');
        t.fresh=false;t.el=e;
      });
      orb=[];
      var rgbs=DESKS.map(function(d){return d.rgb});
      function sat(R,w,a0,rgb,n,rr){
        var head=document.createElementNS(NS,'circle');head.setAttribute('class','orb');head.style.fill='rgb('+rgb+')';head.style.filter='drop-shadow(0 0 6px rgb('+rgb+'))';head.setAttribute('r',rr);net.appendChild(head);
        var tail=[],j;for(j=1;j<=7;j++){var c=document.createElementNS(NS,'circle');c.setAttribute('class','orb');c.style.fill='rgb('+rgb+')';c.style.opacity=(.55*(1-j/8)).toFixed(2);c.setAttribute('r',(rr*(1-j/10)).toFixed(2));net.appendChild(c);tail.push(c)}
        orb.push({R:R,w:w,a:a0,head:head,tail:tail});
      }
      /* orbit tipis di sekitar founder + cincin divisi + cincin agent */
      [[.36,.0011],[.52,-.0008],[.68,.0006]].forEach(function(q,qi){
        var rr=q[0]*L.r1;var c0=circ('ring',rr);c0.style.strokeDasharray='none';c0.style.stroke='rgba(196,181,253,.12)';
        sat(rr,q[1],qi*2.1,rgbs[qi*2],7,2.4);sat(rr,q[1],qi*2.1+3.3,rgbs[qi*2+1],7,1.9);
      });
      sat(L.r1,.00034,0,rgbs[0],7,3.2);sat(L.r1,-.00027,2.1,rgbs[3],7,3);sat(L.r1,.0004,4.2,rgbs[1],7,2.8);
      sat(L.r2,.00018,0.5,rgbs[2],7,3);sat(L.r2,-.00022,1.9,rgbs[4],7,3);sat(L.r2,.00028,3.4,rgbs[5],7,2.8);sat(L.r2,-.00016,4.8,rgbs[0],7,2.6);
      spinOrb(0);
    }
    function spinOrb(T){
      orb.forEach(function(m){
        var a=m.a+T*m.w,sg=m.w>0?1:-1;
        m.head.setAttribute('cx',(L.cx+Math.cos(a)*m.R).toFixed(1));m.head.setAttribute('cy',(L.cy+Math.sin(a)*m.R).toFixed(1));
        m.tail.forEach(function(c,j){var t=a-sg*(j+1)*.075;c.setAttribute('cx',(L.cx+Math.cos(t)*m.R).toFixed(1));c.setAttribute('cy',(L.cy+Math.sin(t)*m.R).toFixed(1))});
      });
    }
    function build(){if(layout())drawNet()}
    (function loop(T){
      requestAnimationFrame(loop);
      if(REDUCED||o.paused||document.hidden||!orb.length)return;
      spinOrb(T);
    })(0);
    function packet(el,rgb,soft){
      if(REDUCED||!el.getTotalLength)return;
      var len=el.getTotalLength();if(!len)return;
      var c=document.createElementNS(NS,'circle');
      c.setAttribute('r',soft?'2.6':'4.5');c.style.fill='rgb('+rgb+')';c.style.filter='drop-shadow(0 0 '+(soft?'5':'7')+'px rgb('+rgb+'))';
      if(soft)c.style.opacity='.85';
      net.appendChild(c);
      var t0=performance.now(),dur=soft?Math.min(3200,1200+len*3):Math.min(1100,450+len*1.6);
      (function f(t){
        if(!el.isConnected){c.remove();return}
        var k=Math.min(1,(t-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,p=el.getPointAtLength(len*e);
        c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);
        if(k<1)requestAnimationFrame(f);else c.remove();
      })(t0);
    }
    /* kirim "paket kerja" dari meja a ke meja b (atau 'F' = founder) */
    o.transit=function(a,b){
      var dest=(b==='F')?a:b,rgb=DESKS[dest==='F'?0:dest].rgb;
      var t={a:a,b:b,rgb:rgb,fresh:true};
      trans.push(t);drawNet();
      if(t.el)packet(t.el,rgb);
    };
    o.paused=false;
    setInterval(function(){
      if(REDUCED||o.paused||document.hidden)return;
      var sts=net.querySelectorAll('.st,.ring');if(!sts.length)return;
      packet(sts[Math.floor(Math.random()*sts.length)],DESKS[Math.floor(Math.random()*6)].rgb,true);
    },420);
    o.redraw=build;
    o.reset=function(){trans=[];drawNet()};
    o.el=function(i){return cards[i]};
    o.box=function(i){return cards[i].querySelector('.bub')};
    o.txt=function(i){return cards[i].querySelector('.t')};
    o.fnd=fnd;o.badge=badge;
    o.setIdle=function(texts){
      DESKS.forEach(function(d,i){
        cards[i].classList.remove('on','done');
        [].slice.call(o.box(i).querySelectorAll('.ok-btn')).forEach(function(x){x.remove()});
        if(texts)o.txt(i).textContent=texts[i];
      });
      fnd.classList.remove('ask','got');badge.textContent='!';
    };
    o.activate=function(i,text){
      cards.forEach(function(c){c.classList.remove('on')});
      cards[i].classList.add('on');cards[i].classList.remove('done');
      if(text!=null)o.txt(i).textContent=text;
    };
    o.complete=function(i,text){
      cards[i].classList.remove('on');cards[i].classList.add('done');
      o.txt(i).textContent=text||'';
    };
    o.view=function(i){cards.forEach(function(c,j){c.classList.toggle('view',j===i)})};
    function onSize(){var w=root.clientWidth;if(w!==lastW){lastW=w;build()}}
    if('ResizeObserver' in window)new ResizeObserver(onSize).observe(root);
    window.addEventListener('resize',onSize);
    window.addEventListener('load',function(){lastW=0;onSize()});
    lastW=root.clientWidth;build();
    return o;
  }
  return {make:make,DESKS:DESKS};
})();

    agency:[['Approvals'],['Lead Intake','Content','Social','Portfolio'],['Qualifier','Proposal','Follow-up','Contracts'],['Scheduler','Project Mgr','Client Comms','Revisions'],['Copywriter','Design Brief','QC Review','Moodboard'],['Invoicing']],
    rental:[['Approvals'],['Catalog','Promos','Social','Reviews'],['Inquiry Reply','Quotes','Booking Lock','Follow-up'],['Calendar','Delivery','Pickup','Returns'],['Cleaning','Testing','Photos','Servicing'],['Billing']],
    travel:[['Approvals'],['Destinations','Content','Social','Promos'],['Lead Intake','Itinerary','Quotes','Follow-up'],['Pickups','Tickets','Vendors','Schedules'],['Itineraries','Vouchers','Briefing','Visa Docs'],['Billing']],
    party:[['Approvals'],['Portfolio','Packages','Social','Promos'],['Lead Intake','Proposal','Estimates','Follow-up'],['Rundown','Vendors','Crew','Venue'],['Decor','Moodboard','Checklist','Setup'],['Billing']],
    mentor:[['Approvals'],['Tips Content','Alumni','Social','Webinars'],['Qualifier','Enrollment','Follow-up','Scholarship'],['Zoom','Schedules','Attendance','Recordings'],['Worksheets','Recaps','Curriculum','Quizzes'],['Billing']],
    retail:[['Approvals'],['Promos','Catalog','Social','Reviews'],['Chat Reply','Orders','Pay Links','Follow-up'],['Shipping','Tracking','Returns','Stock'],['Listings','Photos','Inventory','Pricing'],['Payments']]
  };
  var STEPAG=[0,1,1,0,1,0,2];
  O.DESKS.forEach(function(D,i){O.agents(i,ROSTERS[skin][i])});
  function crew(d,a){return O.el(d).querySelector('.cr[data-a="'+a+'"]')||O.el(d).querySelector('.cr')}
  function crewReset(){[].forEach.call(document.querySelectorAll('.cr'),function(c){c.classList.remove('on','done')})}

  ORDER.forEach(function(k){
    var b=document.createElement('button');b.type='button';b.className='chip';b.dataset.k=k;b.textContent=SKINS[k].chip;
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){setSkin(k,true)});
    chips.appendChild(b);
  });

  var token=0,hidden=false,approveResolve=null;
  function wait(t,ms){
    return new Promise(function(res,rej){
      var left=ms;
      (function step(){
        if(t!==token)return rej(new Error('x'));
        if(hidden)return setTimeout(step,150);
        if(left<=0)return res();
        left-=100;setTimeout(step,100);
      })();
    });
  }
  function setSkin(k,restart){
    skin=k;
    [].forEach.call(chips.querySelectorAll('.chip'),function(c){c.setAttribute('aria-pressed',String(c.dataset.k===k))});
    $('pvskin').textContent=SKINS[k].chip;
    var off=$('office');off.classList.remove('swap');void off.offsetWidth;off.classList.add('swap');
    O.DESKS.forEach(function(D,i){O.agents(i,ROSTERS[k][i])});O.reset();crewReset();O.setIdle(SKINS[k].idle);sendHeight();
    if(restart)start();
  }
  function approval(t){
    var fnd=O.fnd;
    fnd.classList.add('ask');O.badge.textContent='!';
    O.transit(0,'F');
    if(PREVIEW)return wait(t,1700).then(function(){fnd.classList.remove('ask');O.transit('F',0)});
    var btn=document.createElement('button');btn.type='button';btn.className='ok-btn';btn.textContent='Approve';
    O.box(0).appendChild(btn);
    return new Promise(function(res,rej){
      var done=false;
      function fin(){if(done)return;done=true;approveResolve=null;btn.remove();fnd.classList.remove('ask');O.transit('F',0);res()}
      approveResolve=fin;
      btn.addEventListener('click',fin);
      wait(t,6000).then(fin,function(e){if(!done){done=true;approveResolve=null;btn.remove();fnd.classList.remove('ask');rej(e)}});
    });
  }
  async function play(t){
    var S=SKINS[skin];
    O.reset();crewReset();O.setIdle(S.idle);
    await wait(t,PREVIEW?900:1100);
    var prev=null;
    for(var i=0;i<STEPS.length;i++){
      var d=STEPS[i][0];
      if(prev!==null&&prev!==d)O.transit(prev,d);
      O.activate(d,S.flow[i]);var ce=crew(d,STEPAG[i]);ce.classList.remove('done');ce.classList.add('on');
      if(i===1){O.transit(2,3);O.transit(2,5)}
      if(i===4){O.transit(4,1);O.transit(4,0)}
      if(STEPS[i][1])await approval(t);else await wait(t,PREVIEW?1900:2300);
      O.complete(d,i===2?S.ok:S.flow[i]);ce.classList.remove('on');ce.classList.add('done');
      prev=d;
    }
    O.transit(0,'F');
    O.badge.textContent='✓';O.fnd.classList.add('got');
    await wait(t,PREVIEW?2600:3200);
  }
  async function start(){
    var t=++token;
    if(approveResolve){try{approveResolve()}catch(e){}}
    try{
      while(t===token){
        await play(t);
        if(PREVIEW){var n=ORDER[(ORDER.indexOf(skin)+1)%ORDER.length];setSkin(n,false)}
      }
    }catch(e){}
  }
  document.addEventListener('visibilitychange',function(){hidden=document.hidden;O.paused=hidden});
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(en){hidden=document.hidden||!en[0].isIntersecting;O.paused=hidden},{threshold:.05}).observe($('hq'));
  }
  var lastH=0;
  function sendHeight(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h&&h!==lastH&&window.parent!==window){lastH=h;window.parent.postMessage({type:'fluxhq:height',height:h},'*')}
  }
  window.addEventListener('resize',sendHeight);
  if('ResizeObserver' in window)new ResizeObserver(sendHeight).observe($('hq'));
  window.addEventListener('load',sendHeight);
  setSkin(skin,false);
  if(AUTOPLAY)start();
})();

/* ===== floating lines & lights background (FluxOS vibe) ===== */
(function(){
  var hq=document.getElementById('hq');if(!hq)return;
  var cv=document.createElement('canvas');cv.id='bgfx';cv.setAttribute('aria-hidden','true');
  hq.insertBefore(cv,hq.firstChild);
  var g=cv.getContext('2d'),W=0,H=0,D=1,N=[],L=[],vis=true,last=0;
  var RED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var PAL=['167,139,250','200,87,143','231,181,101','79,112,222','63,166,173','154,107,240'];
  function rnd(a,b){return a+Math.random()*(b-a)}
  function build(){
    var r=hq.getBoundingClientRect();W=r.width+20;H=r.height+20;if(W<20||H<20)return;
    D=Math.min(1.5,window.devicePixelRatio||1);cv.width=Math.round(W*D);cv.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0);
    var n=Math.round(Math.max(8,Math.min(16,W*H/52000)));N=[];
    for(var i=0;i<n;i++)N.push({x:rnd(0,W),y:rnd(0,H),vx:rnd(-.014,.014),vy:rnd(-.012,.012),r:rnd(.9,2.2),c:PAL[i%PAL.length],ph:rnd(0,6.3)});
    L=[{bx:.18,by:.2,r:.55,c:'123,79,216',a:.24,sp:.00011,ph:0},{bx:.82,by:.3,r:.45,c:'200,87,143',a:.15,sp:.00009,ph:2},
       {bx:.5,by:.88,r:.55,c:'79,112,222',a:.18,sp:.00012,ph:4},{bx:.7,by:.75,r:.25,c:'231,181,101',a:.09,sp:.00014,ph:1}];
  }
  function frame(T,dt){
    g.clearRect(0,0,W,H);var i,j,m;
    for(i=0;i<L.length;i++){
      m=L[i];var x=W*(m.bx+Math.sin(T*m.sp+m.ph)*.16),y=H*(m.by+Math.cos(T*m.sp*.8+m.ph)*.14),R=Math.max(W*.5,H*.8)*m.r;
      var gr=g.createRadialGradient(x,y,0,x,y,R);gr.addColorStop(0,'rgba('+m.c+','+m.a+')');gr.addColorStop(1,'rgba('+m.c+',0)');
      g.fillStyle=gr;g.fillRect(x-R,y-R,R*2,R*2);
    }
    var lim=W<600?110:160;
    for(i=0;i<N.length;i++){
      m=N[i];m.x+=m.vx*dt;m.y+=m.vy*dt;
      if(m.x<-10)m.x=W+10;else if(m.x>W+10)m.x=-10;if(m.y<-10)m.y=H+10;else if(m.y>H+10)m.y=-10;
    }
    for(i=0;i<N.length;i++){
      m=N[i];var al=.18+.3*Math.abs(Math.sin(T*.0009+m.ph));
      g.fillStyle='rgba('+m.c+','+al.toFixed(3)+')';g.shadowColor='rgba('+m.c+',.9)';g.shadowBlur=8;
      g.beginPath();g.arc(m.x,m.y,m.r,0,6.283);g.fill();
    }
    g.shadowBlur=0;
  }
  function loop(T){
    requestAnimationFrame(loop);
    if(!vis||document.hidden||!W)return;
    var dt=Math.min(48,T-last||16);last=T;frame(T,dt);
  }
  build();
  if('ResizeObserver' in window)new ResizeObserver(function(){build();if(RED&&W)frame(0,0)}).observe(hq);
  else window.addEventListener('resize',build);
  if('IntersectionObserver' in window)new IntersectionObserver(function(en){vis=en[0].isIntersecting},{threshold:0}).observe(hq);
  if(RED){if(W)frame(0,0)}else requestAnimationFrame(loop);
})();
</script>
