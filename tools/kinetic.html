<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #120D06; --panel: #19130A; --card: #1D170D; --card-hi: #261D10;
    --line: #2E2413; --line-hi: #3E3119;
    --teal: #D4A017; --teal-bright: #F5C242;
    --gold: #8B5CF6; --gold-soft: #A78BFA;
    --white: #F5F0E8; --dim: #B0A282; --mute: #6B5E42;
    --green: #10B981; --red: #EF4444;
  }
  html { background: var(--bg); color: var(--white); font-family: "Inter", sans-serif; font-size: 14px; }
  body { min-height: 100vh; overflow-x: hidden; }
  input, select, textarea, button { font-family: inherit; font-size: inherit; color: inherit; }
  .shell { display: flex; flex-direction: column; min-height: 100vh; }

  .top { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 56px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 200; }
  .hbtn { display: none; width: 34px; height: 34px; border-radius: 8px; background: transparent; border: 1px solid var(--line-hi); color: var(--dim); cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0; }
  .hbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .brand { font-size: 17px; font-weight: 800; letter-spacing: -0.2px; }
  .brand span { color: var(--teal-bright); }
  .top-tag { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--mute); border: 1px solid var(--line-hi); border-radius: 6px; padding: 5px 10px; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }

  .body { display: flex; flex: 1; min-height: 0; position: relative; }
  .backdrop { display: none; position: fixed; inset: 0; top: 56px; background: rgba(0,0,0,.55); z-index: 240; }
  .backdrop.show { display: block; }

  .side { width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .side-scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .side-psel-wrap { padding: 12px 12px 6px; position: relative; }
  .side-psel-btn { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line-hi); border-radius: 8px; padding: 9px 11px; cursor: pointer; }
  .psel-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal-bright); flex-shrink: 0; }
  .psel-name { font-size: 12px; font-weight: 600; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .psel-arrow { color: var(--mute); font-size: 9px; flex-shrink: 0; transition: transform .2s; }
  .psel-arrow.open { transform: rotate(180deg); }
  .side-pdd { display: none; margin-top: 4px; background: var(--card); border: 1px solid var(--line-hi); border-radius: 8px; overflow: hidden; }
  .side-pdd.show { display: block; }
  .pdd-item { display: flex; align-items: center; gap: 9px; padding: 9px 12px; cursor: pointer; }
  .pdd-item:hover { background: var(--card-hi); }
  .pdd-item.on { background: rgba(212,160,23,.1); }
  .pdd-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .pdd-n { font-size: 12px; font-weight: 600; color: var(--white); }
  .pdd-del { margin-left: auto; background: transparent; border: none; color: var(--mute); cursor: pointer; font-size: 13px; padding: 2px 4px; }

  .nav-list { padding: 8px 12px; list-style: none; }
  .nav-item { display: flex; align-items: center; padding: 9px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--dim); cursor: pointer; margin-bottom: 2px; }
  .nav-item:hover { background: var(--card-hi); color: var(--white); }
  .nav-item.on { background: rgba(212,160,23,.12); color: var(--teal-bright); }
  .side-nav { flex-shrink: 0; border-top: 1px solid var(--line); padding: 8px 12px; }
  .sf-item { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 7px; font-size: 12.5px; color: var(--dim); cursor: pointer; }
  .sf-item:hover { background: var(--card-hi); color: var(--white); }
  .sf-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; flex-shrink: 0; }

  @media (max-width: 880px) {
    .hbtn { display: flex; }
    .side { position: fixed; top: 56px; left: 0; bottom: 0; width: 260px; z-index: 250; transform: translateX(-100%); transition: transform .22s; box-shadow: 20px 0 40px rgba(0,0,0,.5); }
    .side.mopen { transform: translateX(0); }
  }

  .main { flex: 1; min-width: 0; }
  .page-content { padding: 20px 24px 40px; }
  .page { display: none; }
  .page.active { display: block; }
  .section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--mute); text-transform: uppercase; margin-bottom: 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 8px; padding: 9px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--teal); color: #06110D; }
  .btn-primary:hover { background: var(--teal-bright); }
  .btn-ghost { background: var(--line); color: var(--white); }
  .btn-ghost:hover { background: var(--card-hi); }
  .btn-gold { background: var(--gold); color: #201400; }
  .btn-sm { padding: 6px 11px; font-size: 11.5px; }

  /* ── KOMPLEX-STYLE DASHBOARD CARDS ── */
  .kx-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 12px; }
  @media (max-width: 700px) { .kx-grid { grid-template-columns: 1fr; } }
  .kx-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; position: relative; display: flex; flex-direction: column; }
  /* ── MODAL (replaces window.prompt — works everywhere, webview-safe) ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 900; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: var(--panel); border: 1px solid var(--line-hi); border-radius: 12px; padding: 20px; width: 100%; max-width: 360px; }
  .modal-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .dash-eq-card { height: 232px; overflow: hidden; }
  .kx-rev-bars { display: flex; align-items: flex-end; gap: 10px; flex: 1; margin-top: 10px; padding: 0 4px; }
  .kx-rev-bar { width: 100%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--teal-bright), var(--teal)); min-height: 4px; max-width: 30px; margin: 0 auto; }
  .kx-rev-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .kx-rev-bar-label { font-size: 7.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .kx-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .kx-cat { font-size: 9.5px; font-weight: 700; letter-spacing: 1.3px; color: var(--mute); text-transform: uppercase; margin-bottom: 3px; }
  .kx-title { font-size: 14px; font-weight: 700; color: var(--white); }
  .kx-ai-badge { font-size: 9px; font-weight: 700; color: var(--teal-bright); border: 1px solid var(--teal-bright); border-radius: 5px; padding: 2px 6px; flex-shrink: 0; }
  .kx-value { font-size: 26px; font-weight: 800; margin: 10px 0 2px; }
  .kx-sub { font-size: 10.5px; color: var(--mute); margin-bottom: 10px; }
  .kx-body { flex: 1; min-height: 0; }
  .kx-insight { font-size: 11.5px; color: var(--dim); line-height: 1.6; margin-top: 8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .kx-insight-card { border-color: var(--teal-bright) !important; }
  .kx-insight-dots { display: flex; gap: 5px; margin-top: auto; padding-top: 8px; }
  .kx-insight-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line-hi); }
  .kx-insight-dot.on { background: var(--teal-bright); }

  .kx-donut-wrap { display: flex; flex-direction: row; align-items: center; gap: 14px; flex: 1; min-height: 0; }
  .kx-donut-svg { width: 86px; height: 86px; flex-shrink: 0; }
  .kx-legend { flex: 1; font-size: 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .kx-legend-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .kx-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .kx-legend-label { color: var(--dim); flex: 1; }
  .kx-legend-val { font-family: "DM Mono",monospace; font-weight: 700; }

  .kx-cal-mini { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-top: 4px; }
  .kx-cal-dow-mini { font-size: 7.5px; text-align: center; color: var(--mute); }
  .kx-cal-cell-mini { aspect-ratio: 1; background: var(--panel); border-radius: 3px; border: 1px solid var(--line); font-size: 7px; color: var(--mute); display: flex; align-items: center; justify-content: center; position: relative; }
  .kx-cal-cell-mini.has-post { background: rgba(212,160,23,.18); color: var(--teal-bright); font-weight: 700; }
  .kx-cal-cell-mini.empty { background: transparent; border: none; }

  .kx-link { font-size: 10.5px; color: var(--teal-bright); margin-top: 8px; cursor: pointer; }

  /* ── DASHBOARD ANALYTICS: header, channel tabs, KPI cards, funnel ── */
  .dash-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .dash-head-title { font-size: 18px; font-weight: 800; }
  .dash-head-sub { font-size: 11.5px; color: var(--mute); margin-top: 2px; }
  .dash-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chan-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
  .chan-tab { flex-shrink: 0; background: var(--card); border: 1px solid var(--line); padding: 7px 13px; border-radius: 10px; font-size: 11.5px; font-weight: 700; color: var(--dim); cursor: pointer; white-space: nowrap; }
  .chan-tab.on { background: rgba(212,160,23,.14); border-color: var(--teal-bright); color: var(--teal-bright); }
  .kpi-chg { font-size: 9.5px; font-weight: 700; color: var(--green); font-family: "DM Mono",monospace; }
  .trend-metric-sel { background: var(--line); border: 1px solid var(--line-hi); color: var(--dim); font-size: 9.5px; font-weight: 600; border-radius: 5px; padding: 2px 5px; flex-shrink: 0; }
  .kpi-mini-sub { font-size: 9px; color: var(--mute); margin-top: 2px; }
  .funnel-card { }
  .funnel-shape-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .funnel-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .funnel-shape-meta { flex: 1; display: flex; align-items: center; justify-content: space-between; font-size: 9.5px; font-family: "DM Mono",monospace; color: var(--mute); min-width: 0; }
  .funnel-metric-sel-sm { background: transparent; border: none; color: var(--mute); font-size: 9.5px; font-weight: 700; padding: 0; appearance: none; -webkit-appearance: none; }
  .funnel-metric-sel-sm:focus { outline: none; }

  /* ── SHARED FORM/TABLE ── */
  .kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; align-items: stretch; }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 500px) { .kpi-grid { grid-template-columns: repeat(2,1fr); gap: 8px; } }
  .kpi-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-height: 90px; display: flex; flex-direction: column; justify-content: center; }
  @media (max-width: 500px) { .kpi-card { padding: 10px 11px; border-radius: 8px; min-height: 74px; } }
  .kpi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; gap: 8px; }
  .kpi-label { font-size: 9.5px; font-weight: 700; letter-spacing: 1.3px; color: var(--mute); text-transform: uppercase; }
  .kpi-badge { font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 5px; white-space: nowrap; }
  .kpi-badge.up { background: rgba(16,185,129,.15); color: var(--green); }
  .kpi-value { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
  .kpi-value.teal { color: var(--teal-bright); } .kpi-value.gold { color: var(--gold-soft); } .kpi-value.white { color: var(--white); }

  .chart-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
  .chart-title { font-size: 12.5px; font-weight: 600; margin-bottom: 14px; }
  .rev-chart svg { width: 100%; height: 160px; display: block; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 420px; }
  th { text-align: left; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--mute); padding: 9px 11px; border-bottom: 1px solid var(--line); }
  td { padding: 11px; border-bottom: 1px solid var(--line); color: var(--dim); }
  tr:last-child td { border-bottom: none; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--card-hi); }
  .tier-badge { font-size: 9.5px; font-weight: 700; padding: 3px 7px; border-radius: 5px; }
  .tier-badge.established, .tier-badge.paid, .tier-badge.published, .tier-badge.approved { background: rgba(232,184,75,.15); color: var(--gold-soft); }
  .tier-badge.growth, .tier-badge.unpaid, .tier-badge.draft, .tier-badge.requested { background: rgba(212,160,23,.15); color: var(--teal-bright); }
  .tier-badge.micro { background: rgba(212,160,23,.08); color: var(--mute); }
  .icon-btn { background: var(--line); border: none; border-radius: 6px; width: 28px; height: 28px; color: var(--dim); cursor: pointer; }
  .icon-btn.del:hover { color: var(--red); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field label { font-size: 10.5px; font-weight: 600; color: var(--dim); }
  .field input, .field select, .field textarea { background: var(--line); border: 1px solid var(--line-hi); border-radius: 7px; padding: 9px 11px; color: var(--white); min-height: 40px; width: 100%; box-sizing: border-box; min-width: 0; }
  .field textarea { min-height: 64px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--teal-bright); }
  .week-inputs { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }

  .client-detail { margin-top: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab-btn { background: transparent; border: none; padding: 10px 14px; font-size: 12.5px; font-weight: 600; color: var(--mute); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.on { color: var(--teal-bright); border-bottom-color: var(--teal-bright); }
  .tab-panel { display: none; }
  .tab-panel.on { display: block; }
  .blueprint-result { background: var(--panel); border: 1px solid var(--teal); border-radius: 8px; padding: 14px; font-size: 12.5px; color: var(--dim); line-height: 1.6; margin-top: 14px; display: none; }
  .blueprint-result.show { display: block; }
  .blueprint-summary { background: var(--card); border: 1px dashed var(--line-hi); border-radius: 8px; padding: 12px 14px; font-size: 12px; color: var(--dim); line-height: 1.6; margin-bottom: 16px; max-height: 130px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .bp-label { font-size: 9.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--line); border-radius: 14px; padding: 5px 10px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .chip button { background: transparent; border: none; color: var(--mute); cursor: pointer; font-size: 11px; }

  .gen-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .gen-tab { background: var(--card); border: 1px solid var(--line); padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--dim); cursor: pointer; }
  .gen-tab.on { background: rgba(212,160,23,.12); border-color: var(--teal-bright); color: var(--teal-bright); }
  .gen-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 900px) { .gen-grid { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 560px) { .gen-grid { grid-template-columns: 1fr; } }
  .gen-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; cursor: pointer; }
  .gen-card.active { border-color: var(--teal-bright); background: rgba(212,160,23,.06); }
  .gen-card-title { font-size: 13px; font-weight: 700; color: var(--white); }
  .gen-card-sub { font-size: 11px; color: var(--mute); margin-top: 4px; }
  .gen-output { margin-top: 14px; background: var(--card); border: 1px solid var(--line-hi); border-radius: 10px; padding: 18px; font-size: 12.5px; color: var(--dim); line-height: 1.6; display: none; }
  .gen-output.show { display: block; }
  .gen-output-text { white-space: pre-wrap; margin-top: 10px; }

  .lib-empty { color: var(--mute); font-size: 12.5px; text-align: center; padding: 30px 0; }

  .planner-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .planner-nav { display: flex; align-items: center; gap: 10px; }
  .planner-arrow { width: 30px; height: 30px; border-radius: 7px; background: var(--line); border: none; color: var(--white); cursor: pointer; }
  .planner-month { font-size: 14px; font-weight: 700; min-width: 130px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
  .cal-dow { font-size: 9.5px; text-align: center; color: var(--mute); font-weight: 700; padding-bottom: 6px; text-transform: uppercase; }
  .cal-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 78px; padding: 5px; font-size: 10.5px; color: var(--mute); cursor: pointer; display: flex; flex-direction: column; overflow: hidden; }
  .cal-cell.empty { background: transparent; border: none; cursor: default; }
  .cal-post { margin-top: 3px; font-size: 8.5px; padding: 2px 4px; border-radius: 4px; font-weight: 600; background: rgba(212,160,23,.2); color: var(--teal-bright); display: flex; justify-content: space-between; gap: 3px; align-items: center; line-height: 1.3; }
  .cal-post .x { cursor: pointer; opacity: .6; flex-shrink: 0; }
  @media (max-width: 640px) {
    .cal-grid { gap: 2px; }
    .cal-cell { min-height: 52px; padding: 2px; font-size: 8.5px; }
    .cal-post { font-size: 6.5px; padding: 1px 3px; border-radius: 3px; margin-top: 2px; line-height: 1.3; }
    .cal-post span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  .task-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 800px) { .task-cols { grid-template-columns: 1fr; } }
  .task-col { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .task-col-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; }
  .task-col-title-wrap { display: flex; align-items: center; gap: 7px; }
  .task-col-title { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--mute); }

function stat(l,v,b,c){return '<div class="kpi-card"><div class="kpi-top"><span class="kpi-label">'+l+'</span>'+(b?'<span class="kpi-badge '+(c==='dn'?'dn':'up')+'">'+b+'</span>':'')+'</div><div class="kpi-value white">'+v+'</div></div>'}
function donut(parts){var tot=parts.reduce(function(a,p){return a+p[1]},0)||1,off=0,C=2*Math.PI*30;
 var arcs=parts.map(function(p){var l=p[1]/tot*C,s='<circle cx="43" cy="43" r="30" fill="none" stroke="'+p[2]+'" stroke-width="12" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 43 43)"/>';off+=l;return s}).join('');
 return '<div class="kx-donut-wrap"><svg class="kx-donut-svg" viewBox="0 0 86 86" role="img" aria-label="Chart: '+parts.map(function(p){return p[0]+' '+p[1]}).join(', ')+'">'+arcs+'</svg><div class="kx-legend">'+parts.map(function(p){return '<div class="kx-legend-row"><span class="kx-legend-dot" style="background:'+p[2]+'"></span><span class="kx-legend-label">'+p[0]+'</span><span class="kx-legend-val">'+p[1]+'</span></div>'}).join('')+'</div></div>'}
function bars(vals,labels){var m=Math.max.apply(null,vals)||1;return '<div class="mini-bars" role="img" aria-label="Bars: '+vals.map(function(v,i){return labels[i]+' '+v}).join(', ')+'">'+vals.map(function(v,i){return '<div><i style="height:'+Math.max(4,v/m*100)+'%"></i>'+labels[i]+'</div>'}).join('')+'</div>'}
